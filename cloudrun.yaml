apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finbuddy
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/finbuddy:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GEMINI_API_KEY
            - name: SECRET_KEY
              value: "production-jwt-secret-replace-me"
