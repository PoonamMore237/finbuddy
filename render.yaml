services:
  - type: web
    name: finbuddy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./finbuddy.db
    disk:
      name: finbuddy-data
      mountPath: /data
      sizeGB: 1
